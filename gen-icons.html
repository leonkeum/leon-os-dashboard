<!DOCTYPE html><html><body><canvas id="c"></canvas><script>
// Generate both icons and auto-download them
[192, 512].forEach(size => {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const r = size * 0.16;

  // Dark background with rounded rect
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, size, size);

  // Green dot — centered, proportional
  const cx = size / 2, cy = size / 2;
  const dotR = size * 0.18;

  // Glow
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, dotR * 1.8);
  grad.addColorStop(0, 'rgba(77,170,125,0.5)');
  grad.addColorStop(1, 'rgba(77,170,125,0)');
  ctx.beginPath(); ctx.arc(cx, cy, dotR * 1.8, 0, Math.PI * 2);
  ctx.fillStyle = grad; ctx.fill();

  // Solid dot
  ctx.beginPath(); ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
  ctx.fillStyle = '#4daa7d'; ctx.fill();

  // "L" letter or just clean dot
  ctx.fillStyle = '#0a0a0a';
  ctx.font = `bold ${size * 0.22}px Inter, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('L', cx, cy + size * 0.01);

  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `icon-${size}.png`;
    a.click();
  }, 'image/png');
});
</script></body></html>
